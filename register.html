<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Solo2Squad</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav>

    <div class="logo">
        Solo<span>2</span>Squad
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>


<div class="form-container">

    <h2>
        Create Account
    </h2>

    <p>
        Join Solo2Squad and find your
        travel partners.
    </p>


    <input
        type="text"
        id="name"
        placeholder="Full Name"
    >


    <input
        type="email"
        id="email"
        placeholder="Email Address"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <input
        type="text"
        id="city"
        placeholder="Your City"
    >


    <button id="registerBtn">

        Create Account

    </button>


    <p class="form-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</div>


<script
    type="module"
    src="script.js">
</script>

</body>

</html>
