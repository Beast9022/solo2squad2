<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Solo2Squad</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

    <div class="logo">
        Solo<span>2</span>Squad
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="trips.html">
            Find Trips
        </a>

        <a href="register.html">
            Register
        </a>

    </div>

</nav>



<div class="form-container">

    <h2>
        Welcome Back 👋
    </h2>

    <p>
        Login to continue your journey.
    </p>


    <input
        type="email"
        id="loginEmail"
        placeholder="Email address"
    >


    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >


    <button id="loginBtn">
        Login
    </button>


    <p class="form-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </p>

</div>



<script
    type="module"
    src="script.js">
</script>


</body>

</html>
